name: in_time_bartender
description: "In Time Bartender — premium time-based bar experience."
publish_to: 'none'
version: 1.0.0+27

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  provider: ^6.1.5
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  crypto: ^3.0.6
  supabase_flutter: ^2.16.0
  flutter_secure_storage: ^10.3.1
  audioplayers: ^6.8.1
  live_activities: ^2.4.9
  flutter_local_notifications: ^22.1.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  add_2_calendar: ^3.1.1
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0E0E0E"
  adaptive_icon_foreground: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/legal/
